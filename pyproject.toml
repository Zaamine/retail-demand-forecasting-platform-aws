[project]
name = "retail-demand-forecasting-platform-aws"
version = "0.1.0"
description = "Production-ready retail demand forecasting platform on AWS."
requires-python = ">=3.12,<3.13"

# Runtime libraries used directly by the forecasting and data-processing code.
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
]

# Development and analytical tooling used to explore, transform, and validate
# the project without being part of the core forecasting runtime.
[project.optional-dependencies]
dev = [
    # Jupyter kernel used to execute the project notebooks.
    "ipykernel==7.4.0",
    "pytest==9.2.0",
    "boto3==1.43.113",
    "mlflow==3.18.0",
    "torch==2.15.0",
    "transformers==5.23.0",
    "peft==0.21.3",
    "accelerate==1.15.0",

    # dbt CLI and Athena adapter used to build and test the curated data layer.
    "dbt-core==1.12.5",
    "dbt-athena-community==1.11.1",
]
